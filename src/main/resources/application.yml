# ==============================================================================================
# /**
#  * @file        application.yml
#  * @module      Micronaut Core Configuration Manifest
#  * @description Centralized configuration template for CI/CD pipelines.
#  *              Orchestrates application identity, network topology, OpenAPI
#  *              documentation, health telemetry, and high-performance database
#  *              connection pooling. Adheres strictly to 12-factor app principles.
#  *
#  * @maintainer  Platform Engineering Team
#  */
# ==============================================================================================

micronaut:
  application:
    # Uses environment variables with safe defaults for local development
    name: ${SERVICE_NAME:micronaut-user-service}

  server:
    port: ${SERVICE_PORT:8082}
    cors:
      enabled: ${CORS_ENABLED:true}
    netty:
      # -----------------------------------------------------------------------------------------
      # [MISSION CRITICAL] - Graceful Shutdown for Kubernetes
      # Ensures in-flight reactive streams finish processing before the pod is terminated.
      # -----------------------------------------------------------------------------------------
      graceful-shutdown-quiet-period: 2s
      graceful-shutdown-timeout: 15s

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  OpenAPI / Swagger Routing
  #  * @description Maps static classpath resources generated by the 'micronaut-openapi'
  #  *              annotation processor during the build compilation phase.
  #  */
  # ----------------------------------------------------------------------------------------------
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Management Endpoints & Telemetry
#  * @description Exposes structural application telemetry and dynamic management interfaces.
#  *              - health: Kubernetes native probes (Liveness/Readiness).
#  *              - loggers: Allows real-time log level mutation without JVM restarts.
#  *              - info: Exposes CI/CD build context and git commit hashes.
#  */
# ----------------------------------------------------------------------------------------------
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    kubernetes:
      enabled: true
  loggers:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Data Persistence / MongoDB Driver
#  * @description Configures the MongoDB driver with production-grade constraints.
#  *              Implements a robust connection pool topology, aggressive socket timeouts
#  *              to prevent thread starvation, and majority write concerns to ensure
#  *              strict data durability across replica sets.
#  *
#  * @tuning      uuid-representation: STANDARD - Mandated to resolve BSON
#  *              CodecConfigurationException, enforcing RFC 4122 binary subtype 4.
#  */
# ----------------------------------------------------------------------------------------------
mongodb:
  uri: ${MONGODB_URI:mongodb://localhost:27017/default_db}
  uuid-representation: STANDARD
  connection-pool:
    max-size: 100
    min-size: 10
    max-wait-time: 120000ms
  socket:
    connect-timeout: 10000ms
    read-timeout: 15000ms
  write-concern:
    w: majority
    journal: true
  retry-writes: true

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Eager Initialization / Dependency Warm-up
#  * @description Configures external target URLs for the ExternalEndpointsHealthIndicator.
#  *              These endpoints are proactively pinged during the application StartupEvent
#  *              to resolve DNS and complete SSL handshakes, avoiding cold-start latency.
#  */
# ----------------------------------------------------------------------------------------------
warmup:
  endpoints:
    google-search: ${EXTERNAL_DEP_1:https://www.google.com}